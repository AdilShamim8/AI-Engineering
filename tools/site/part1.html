<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineering — the field guide, verified</title>
<meta name="description" content="An open self-study library for becoming an AI engineer: a 6-section technical curriculum, two roadmaps, a 19-lecture evaluation course, and interview preparation — every link on this page generated from the repository's own file tree.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='6' fill='%23f7f4ec'/><text x='50' y='72' font-size='58' text-anchor='middle' font-family='Georgia' fill='%2393331d'>AI</text></svg>">
<style>
/* ============================================================
   AI ENGINEERING — THE FIELD GUIDE
   A single-file editorial site in the same paper-and-ink
   monograph style as the sister site
   (adilshamim8.github.io/AI-Safety): paper, ink, one accent.
   No frameworks, no external fonts, no network. Generated by
   tools/build_site.py from the repository's own file tree —
   the counts below are never hand-written.
   ============================================================ */

:root{
  --paper:#f7f4ec;
  --paper-2:#efeade;
  --paper-3:#e8e1d0;
  --ink:#211d16;
  --ink-2:#5b5446;
  --ink-3:#8f8674;
  --rule:#d8d0bd;
  --rule-2:#b9af97;
  --accent:#93331d;          /* oxblood */
  --accent-deep:#6f2413;
  --accent-wash:#f1e2da;
  --link:#31588a;
  --ok:#4a6b38;
  --ok-wash:#e9ecdf;
  --warn:#8a681c;
  --warn-wash:#f0e8d3;
  --serif:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
  --sans:'Avenir Next','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

a{color:var(--link);text-decoration:none;border-bottom:1px dotted var(--rule-2)}
a:hover{color:var(--accent);border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-bottom-color:transparent}
b{font-weight:600}
p{margin:0 0 14px}
p.note{font-size:14px;color:var(--ink-2)}
i{font-style:italic}
small{font-size:12.5px;color:var(--ink-3)}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--paper);
  border-bottom:1px solid var(--rule-2);
  display:flex;align-items:baseline;justify-content:space-between;
  padding:10px 26px;gap:18px}
.topbar .wordmark{font-family:var(--serif);font-weight:700;font-size:17px;
  color:var(--ink);letter-spacing:-.01em;border-bottom:none;white-space:nowrap}
.topbar .wordmark em{font-style:normal;color:var(--accent)}
.topbar .wordmark:hover{color:var(--accent)}
.topbar .strap{font-family:var(--sans);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.topbar .acts{display:flex;gap:14px;font-family:var(--sans);font-size:12.5px;white-space:nowrap}
.topbar .acts a{color:var(--ink-2);border-bottom-color:transparent}
.topbar .acts a:hover{color:var(--accent)}
.topbar .acts .sep{color:var(--rule-2)}

/* mobile contents toggle */
.toc-toggle{display:none}
.toc-toggle::after{content:"▾";margin-left:auto;color:var(--accent)}

/* ---------- frame: sidebar + main ---------- */
.frame{display:grid;grid-template-columns:232px minmax(0,1fr);
  max-width:1220px;margin:0 auto}

.toc{border-right:1px solid var(--rule);padding:30px 18px 60px 26px;
  position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto;
  font-family:var(--sans);scrollbar-width:thin}
.toc-title{font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);padding:0 2px 10px;border-bottom:1px dotted var(--rule-2);margin-bottom:10px}
.toc a{display:flex;gap:9px;align-items:baseline;padding:5.5px 2px 5.5px 10px;
  color:var(--ink-2);font-size:12.5px;line-height:1.3;border:none;
  border-left:2px solid transparent}
.toc a:hover{color:var(--accent);background:none}
.toc a .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:26px}
.toc a.on{color:var(--accent-deep);border-left-color:var(--accent);font-weight:600}
.toc a.on .n{color:var(--accent)}
.toc-foot{margin-top:18px;padding:14px 2px 0;border-top:1px dotted var(--rule-2);
  font-size:11px;color:var(--ink-3);line-height:1.7}
.toc-foot .mono{display:block;margin-top:4px;color:var(--ink-2);background:var(--paper-2);
  border:1px solid var(--rule);border-radius:2px;padding:3px 7px;width:max-content;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);font-size:10.5px}

main{padding:0 34px 90px;min-width:0}

/* ---------- section scaffolding ---------- */
section{padding-top:64px;margin-top:26px;border-top:1px solid var(--rule-2);scroll-margin-top:70px}
.mast{border-top:none;padding-top:26px}
.sechead{margin-bottom:26px}
.kicker{font-family:var(--sans);font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sechead .kicker{margin-bottom:6px}
.sechead h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.4vw,34px);
  letter-spacing:-.012em;line-height:1.12;margin:6px 0 4px}
.sechead .lede{font-size:16.5px;color:var(--ink-2);max-width:70ch;margin-top:10px}
.blockhead{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px}
.blockhead .bh-t{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--sans);color:var(--ink)}
.blockhead .bh-r{flex:1;border-bottom:1px dotted var(--rule-2);transform:translateY(-4px)}

/* ---------- masthead ---------- */
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(44px,7vw,76px);
  line-height:.98;letter-spacing:-.022em}
.mast h1 .dot{color:var(--accent)}
.mast .dek{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.4vw,23px);
  color:var(--ink-2);margin:14px 0 0;max-width:34ch;line-height:1.35}
.mast .facts{margin-top:22px;font-family:var(--sans);font-size:13px;color:var(--ink-2);
  display:flex;flex-wrap:wrap;gap:6px 22px}
.mast .facts b{font-family:var(--mono);font-size:13.5px;color:var(--ink);font-weight:600}
.mast .status{margin-top:26px;max-width:76ch;font-size:16.5px}
.mast .status::first-letter{float:left;font-size:50px;line-height:.86;
  padding:7px 14px 0 0;color:var(--accent);font-weight:700}

/* the learning chain */
.chain{margin:34px 0 8px;padding:22px 26px;background:var(--paper-2);
  border:1px solid var(--rule);border-left:3px solid var(--accent);
  font-family:var(--serif);font-size:15.5px;line-height:2;max-width:78ch}
.chain-label{display:block;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.chain .step{white-space:nowrap}
.chain .step b{font-family:var(--mono);font-size:13px;color:var(--accent-deep);font-weight:600}
.arr{color:var(--accent);padding:0 .45em;font-family:var(--sans)}

/* stat ledger */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:0;margin-top:30px;border:1px solid var(--rule-2);background:var(--paper)}
.ledger .cell{padding:16px 20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ledger .cell .k{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px}
.ledger .cell .v{font-family:var(--mono);font-size:26px;font-weight:600;
  letter-spacing:-.02em;line-height:1.1}
.ledger .cell .v small{font-size:16px;color:var(--ink-3);font-weight:400}
.ledger .cell.accent .v{color:var(--accent)}

/* ---------- tables ---------- */
.mtable{width:100%;border-collapse:collapse;font-size:14.5px;margin:18px 0 8px}
.mtable th{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;
  padding:10px 14px 8px;border-bottom:1px solid var(--rule-2)}
.mtable td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.5}
.mtable tr:hover td{background:var(--paper-2)}
.mtable td .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.mtable .num{font-family:var(--mono);font-weight:600;color:var(--accent-deep);white-space:nowrap}
.mtable .dur{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}

/* ---------- chapter rows (curriculum) ---------- */
.chap{display:grid;grid-template-columns:64px minmax(0,1fr) 220px;gap:0;
  padding:16px 0 15px;border-bottom:1px solid var(--rule)}
.chap:last-child{border-bottom:none}
.chap .cn{font-family:var(--mono);font-size:15px;font-weight:600;padding-top:3px}
.chap .cb h3{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.chap .cb h3 a{color:var(--ink);border-bottom-color:transparent}
.chap .cb h3 a:hover{color:var(--accent)}
.chap .cb .cd{font-size:14.5px;color:var(--ink-2);max-width:66ch}
.chap .cb .cl{margin-top:8px;font-family:var(--sans);font-size:12px;line-height:2.1;color:var(--ink-2)}
.chap .cb .cl a{margin-right:14px;white-space:nowrap}
.chap .cm{font-family:var(--sans);font-size:12px;color:var(--ink-3);
  border-left:1px dotted var(--rule-2);padding-left:16px;line-height:1.9}
.chap .cm b{font-family:var(--mono);color:var(--ink);font-weight:600}

/* ---------- steps (numbered how-to) ---------- */
.steps{counter-reset:step;margin-top:6px}
.step{counter-increment:step;display:grid;grid-template-columns:40px minmax(0,1fr);
  gap:14px;padding:14px 0;border-bottom:1px dotted var(--rule);margin:0}
.step:last-child{border-bottom:none}
.step::before{content:counter(step);font-family:var(--mono);font-size:15px;
  color:var(--accent);font-weight:600;padding-top:2px}
.step .st{font-weight:700;font-size:16px}
.step .st .time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-weight:400;margin-left:10px}
.step p{font-size:14.5px;color:var(--ink-2);margin:3px 0 0}

/* ---------- colophon grids ---------- */
.colo{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:0;border:1px solid var(--rule-2)}
.colo .cell{padding:18px 20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.colo .cell h4{font-family:var(--sans);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent-deep);margin-bottom:8px}
.colo .cell p{font-size:13.5px;color:var(--ink-2);margin:0}
.colo .cell ul{list-style:none;margin:0}
.colo .cell li{font-size:13.5px;padding:3px 0}
.colo .cell li::before{content:"—";color:var(--rule-2);margin-right:8px}

/* ---------- searchbar & chips ---------- */
.searchbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:16px 0 18px;font-family:var(--sans)}
.searchbar input{font-family:var(--sans);font-size:13px;padding:8px 14px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule-2);border-radius:2px;
  min-width:260px;flex:1;max-width:420px;outline:none}
.searchbar input:focus{border-color:var(--accent)}
.searchbar .count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.chip{font-family:var(--sans);font-size:12px;padding:4px 12px;cursor:pointer;
  border:1px solid var(--rule-2);border-radius:999px;background:var(--paper);
  color:var(--ink-2);letter-spacing:.02em;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-deep)}

/* ---------- library file groups ---------- */
.fgroup{border:1px solid var(--rule);margin-bottom:14px;background:var(--paper)}
.fgroup summary{cursor:pointer;padding:12px 18px;font-family:var(--sans);
  font-size:13px;font-weight:600;color:var(--ink);display:flex;
  align-items:center;gap:10px;list-style:none;user-select:none}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  background:var(--paper-2);border:1px solid var(--rule);border-radius:2px;padding:1px 8px}
.fgroup summary .dot{width:8px;height:8px;border-radius:1px;background:var(--gc,var(--accent))}
.fgroup[open] summary{border-bottom:1px dotted var(--rule-2)}
.flist{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;padding:10px 14px 14px}
.flist a{font-size:13px;color:var(--ink-2);padding:4.5px 8px;border-bottom:none;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--sans)}
.flist a::before{content:"·";color:var(--rule-2);margin-right:9px}
.flist a:hover{color:var(--accent);background:var(--paper-2)}
.flist a .p{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-left:8px}
.fb-empty{padding:26px;text-align:center;color:var(--ink-3);font-size:14px;font-style:italic}

/* ---------- footer / colophon ---------- */
#colophon .genfoot{margin-top:26px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--rule-2);padding-top:14px;line-height:1.9}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .frame{grid-template-columns:1fr}
  .topbar .strap{display:none}
  .topbar{padding:10px 18px}
  .topbar .acts{gap:10px;font-size:12px}
  .toc{position:static;height:auto;display:none;border-right:none;
    border-bottom:1px solid var(--rule);padding:14px 22px 18px}
  .toc.open{display:block}
  .toc-toggle{display:flex;align-items:center;gap:10px;background:var(--paper);
    border:none;border-bottom:1px solid var(--rule);width:100%;padding:12px 22px;
    font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-2);cursor:pointer}
  main{padding:0 22px 70px}
  .chap{grid-template-columns:44px minmax(0,1fr)}
  .chap .cm{border-left:none;border-top:1px dotted var(--rule);
    padding-left:6px;margin-top:10px;grid-column:2}
}
@media (max-width:640px){
  .mtable thead{display:none}
  .mtable,.mtable tbody,.mtable tr,.mtable td{display:block;width:100%}
  .mtable tr{border-bottom:1px solid var(--rule-2);padding:6px 0}
  .mtable td{border-bottom:none;padding:6px 2px}
  .mtable td::before{content:attr(data-th);font-family:var(--sans);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    display:block;margin-bottom:2px}
  .mast .facts{display:grid;grid-template-columns:repeat(3,auto);
    justify-content:start;gap:7px 16px}
  .flist{grid-template-columns:1fr}
  .step{grid-template-columns:28px minmax(0,1fr);gap:10px}
  .mast .status::first-letter{font-size:40px}
}
@media print{
  .topbar,.toc,.toc-toggle,.searchbar{display:none!important}
  body{background:#fff}
  .frame{grid-template-columns:1fr}
  main{padding:0}
  section{page-break-inside:avoid;padding-top:20px}
  .rv{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
